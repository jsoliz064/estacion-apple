name: ${CONTAINER_NAME}

services:
  app:
    build:
      context: ./
      dockerfile: Dockerfile
    image: ${CONTAINER_NAME}
    working_dir: /var/www/html/
    restart: always
    container_name: ${CONTAINER_NAME}
    hostname: ${CONTAINER_NAME}
    volumes:
      - ./:/var/www/html/:rw
    networks:
      - server-network

networks:
  server-network:
    external: true
