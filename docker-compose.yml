services:
  estacion-apple:
    build:
      context: ./
      dockerfile: Dockerfile
    image: estacion-apple
    working_dir: /var/www/html/
    restart: always
    container_name: estacion-apple
    hostname: estacion-apple
    volumes:
      - ./:/var/www/html/:rw
    networks:
      - server-network

networks:
  server-network:
    external: true
